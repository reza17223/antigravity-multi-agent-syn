name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git identity for hook tests
        run: |
          git config --global user.name "CI Test Agent"
          git config --global user.email "ci@example.com"

      - name: Run unit and integration test suite
        run: python -m unittest discover -s tests -v

      - name: Run smoke check
        run: python scripts/smoke_check.py --spawn-local

      - name: Run agsync doctor
        run: python -m agsync.cli doctor --repo . --json
